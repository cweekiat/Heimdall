# Nightly security re-scan (task 064): new CVEs appear after merge. Reports high and above,
# including the web advisories that do not block PRs (see ci.yml).
name: nightly
on:
  schedule: [{cron: "17 19 * * *"}]   # 03:17 Singapore time
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.12.12"}
      - name: Python dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/req.txt"
          uvx pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/req.txt"
      - name: Web dependencies (high and above)
        if: always()
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - uses: docker/login-action@v3
        if: always()
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Deployed images (latest release tag)
        if: always()
        run: |
          tag=$(git ls-remote --tags --sort=-v:refname origin 'v*.*.*' | head -1 | sed 's#.*refs/tags/##; s#\^{}##')
          [ -n "$tag" ] || { echo "no release yet"; exit 0; }
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          for img in heimdall heimdall-edge; do
            docker run --rm -v "$HOME/.docker:/root/.docker:ro" aquasec/trivy:0.66.0 \
              image --quiet --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "$repo/$img:$tag"
          done
