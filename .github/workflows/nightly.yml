# Nightly dependency re-scan (task 064): new CVEs appear after merge. Reports high and above.
name: nightly
on:
  schedule: [{cron: "17 19 * * *"}]   # 03:17 Singapore time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.12.12"}
      - name: Python dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project -o "$RUNNER_TEMP/req.txt"
          uvx pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/req.txt"
      - name: Web dependencies (high and above)
        if: always()
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
