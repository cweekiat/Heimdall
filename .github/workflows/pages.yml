# GitHub Pages project page (task 068): static, no backend. Enable once in
# Settings -> Pages -> Source: GitHub Actions (public repository).
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/media/**", "scripts/build_site.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: {group: pages, cancel-in-progress: true}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - run: scripts/build_site.sh _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: {path: _site}
      - id: deployment
        uses: actions/deploy-pages@v5
