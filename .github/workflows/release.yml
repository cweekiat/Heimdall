# Production release (task 064, ADR-009). Pushing a tag vX.Y.Z IS the approval to deploy:
#   git tag -a v0.4.0 -m "..." && git push origin v0.4.0
# The image is the one already built from the tagged commit on main and verified on dev
# (sha-<commit>); it is promoted, never rebuilt.
name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency: {group: deploy-prod, cancel-in-progress: false}

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read, packages: write}
    outputs:
      tag: ${{ github.ref_name }}
      repo: ${{ steps.meta.outputs.repo }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Tag must be a plain version on a commit on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad tag"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: meta
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "src=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Promote the dev-verified images to the release tag
        env:
          REPO: ${{ steps.meta.outputs.repo }}
          SRC: ${{ steps.meta.outputs.src }}
          DST: ${{ github.ref_name }}
        run: |
          for img in heimdall heimdall-edge; do
            docker buildx imagetools inspect "$REPO/$img:$SRC" >/dev/null \
              || { echo "::error::$REPO/$img:$SRC not found: merge to main and let dev pass first"; exit 1; }
            docker buildx imagetools create -t "$REPO/$img:$DST" "$REPO/$img:$SRC"
          done

  deploy-prod:
    needs: promote
    # Self-hosted runner on the prod VM, label heimdall-prod: only this tag-triggered job may use it.
    runs-on: [self-hosted, linux, arm64, heimdall-prod]
    timeout-minutes: 20
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - run: deploy/scripts/deploy.sh "$TAG"   # via env, never interpolated into the script
        env:
          TAG: ${{ needs.promote.outputs.tag }}
          IMAGE_REPO: ${{ needs.promote.outputs.repo }}

  verify-prod:
    needs: deploy-prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: deploy/scripts/smoke.sh "${{ vars.PROD_URL }}"
