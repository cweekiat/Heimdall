# Heimdall runtime configuration. Thresholds cite provenance; calibrate via backtest before changing.

storage:
  duckdb_path: data/heimdall.duckdb
  lake_dir: data/lake
  bus: memory          # memory | redis (scale-out)
  store: duckdb        # duckdb | clickhouse (scale-out)

privacy:
  # Nothing leaves this machine except GET requests to allow-listed data sources.
  allow_llm_egress: false          # P5: the user must set true before any Evidence is sent to the Claude API
  allow_outbound_sharing: false    # exports/briefs stay local; no upload/share integrations
  redact_entities_in_exports: true

api:
  host: 127.0.0.1      # localhost only until auth is enabled
  port: 8000
  auth: none           # none | oidc (hosted)

ui:
  # Base map. openfreemap = OpenFreeMap vector tiles (third party sees viewed areas; user-accepted).
  # carto = CARTO vector tiles; none = fully private blank local style (no third-party requests).
  basemap: openfreemap   # openfreemap | carto | none
  overlays: [borders]    # default-on overlays: borders | military | eez | seamarks | graticule

aois:
  # role: primary = monitored & alerted; control = calibration/validation only
  - {name: myanmar,        label: "Myanmar", role: primary, lat: 20.5, lon: 96.5,  radius_nm: 250}
  - {name: south_china_sea, label: "South China Sea", role: primary, lat: 12.5, lon: 113.5, radius_nm: 250}
  - {name: taiwan_luzon,   label: "Taiwan / Luzon Strait", role: primary, lat: 22.5, lon: 120.5, radius_nm: 250}
  - {name: malacca_sg,     label: "Malacca / Singapore Strait", role: primary, lat: 3.0,  lon: 100.8, radius_nm: 250}
  - {name: baltic,         label: "Baltic (control)", role: control, lat: 56.0, lon: 20.5,  radius_nm: 250}

detectors:
  jamming:
    h3_res: 4                 # ~1,770 km^2; r6 too sparse for SE Asia traffic
    window_min: 30
    step_min: 5
    nic_bad_below: 7          # GPSJam convention (NIC < 7 = degraded)
    nacp_bad_below: 8
    bad_dwell_frac: 0.5       # aircraft counts bad if >=50% of its in-cell reports are degraded
    min_aircraft: 5
    ratio_alert: 0.10         # GPSJam 'red' (>10%); de-noised (bad-1)/total
    ratio_clear: 0.06         # hysteresis
    baseline_days: 14
    robust_z: 3.0             # vs median/MAD baseline — alert only on change
    persistence_windows: 2
    mad_floor: 0.02           # eps in z denominator; quiet cell (MAD=0) needs R' >= 0.06 for z>=3. Prior, not yet backtested
    baseline_min_samples: 288 # 1 day of 5-min ticks before z is enforced; until then "no baseline" gap. Prior
    full_coverage_aircraft: 15  # coverage confidence saturates at 15 quality aircraft (docs/detectors.md)
    single_provider_factor: 0.8 # confidence penalty when only one aggregator sees the cell. Prior
  spoofing:
    min_dt_s: 5
    teleport_kt: 1323         # Mach 2 @ ISA SL
    speed_diff_kt: 150
    alt_divergence_ft: 1000   # |alt_geom - alt_baro| beyond regional norm
    mlat_gap_km: 5
    min_signals: 2
    window_min: 30
    step_min: 5
    speed_pair_max_s: 30      # |v_calc-gs| only on pairs <= 30 s (chord error < 10% in a 3 deg/s turn)
    persist_pairs: 2          # S1 must persist >= 2 pairs; single out-and-back fixes are glitches
    s1_span_cap_s: 300        # one jump's anomalous span < 1 step (5 min): a lone jump cannot reach persistence 2
    alt_norm_min_aircraft: 3  # S2 regional norm = median over >= 3 aircraft in the r4 cell
    mlat_max_dt_s: 10
    mlat_min_pairs: 2         # one MLAT outlier is not enough
    cluster_km: 2.0           # S4 (docs/detectors.md)
    cluster_min_aircraft: 3
    cluster_circvar_min: 0.3  # tracks must disagree; formations (same track) excluded
    cluster_min_bins: 2       # S4 in >= 2 one-minute bins
    nic_trusted_min: 7        # S5: GPSJam NIC convention
  orbit:
    window_min: 75
    min_points: 20
    circ_var_min: 0.5
    cum_turn_min_deg: 360
    displacement_max: 0.25
    mil_types: [K35R, KC46, K35E, A332, MRTT, E3TF, E3CF, E737, E7WW, R135, RC35, P8, Q4, GLEX, Y8, Y9, KJ50, KJ2K, H6]
    jam_proximity_km: 100
    critical_min_tankers: 2
    tanker_types: [K35R, K35E, KC46, MRTT, A332, KC10, KC30, Y20U]
    step_min: 5
    resample_s: 30            # thin to >= 30 s so heading noise cannot accumulate into 360 deg
    turn_deadband_deg: 3.0    # ignore sub-3-deg heading jitter in cumulative turn
    novelty_scale_h: 24       # novelty = exp(-prior orbit hours in cell (14 d) / 24 h). Prior
    mlat_factor: 0.8          # confidence penalty for MLAT-majority tracks
  ais_spoofing:             # task 010; every value below is a prior, not backtested
    h3_res: 4
    window_min: 60          # prior, not backtested
    step_min: 5
    teleport_kn: 60         # no merchant ship exceeds ~40 kn; 60 leaves margin. Prior, not backtested
    jump_min_km: 5          # ignore short hops with quantised timestamps. Prior, not backtested
    persist_pairs: 2        # GNSS S1 convention; single out-and-back fixes are glitches. Prior
    span_cap_s: 300         # one jump's anomalous span < 1 step, so a lone jump cannot reach persistence 2. Prior
    collision_km: 50        # two clusters this far apart, alternating = shared MMSI, not spoofing. Prior
    identical_min_vessels: 3   # distinct MMSIs at one position. Prior, not backtested
    identical_decimals: 5      # ~1 m; rafted ships 20 m apart never match. Prior, not backtested
    identical_bin_s: 300
    ring_min_vessels: 5     # Prior, not backtested
    ring_cv_max: 0.1        # radial-distance CV of a spoofed ring. Prior, not backtested
    ring_bearing_circvar_min: 0.7
    ring_radius_km: [0.2, 30]
    ring_poisson_p: 1.0e-3  # chance-alignment guard for RANSAC ring (013a2). Prior, not backtested
    ring_hollow_abs: 1      # interior MMSIs allowed inside 0.8R regardless of density
    ring_hollow_frac: 0.5   # ... or this fraction of the expected interior count
    circle_min_fixes: 20
    circle_rel_rmse_max: 0.05
    circle_min_turn_deg: 720   # >= 2 laps; a purse-seine set is one lap. Prior, not backtested
    circle_max_radius_km: 5
    full_coverage_fixes: 20    # coverage confidence saturates at 20 fixes. Prior
    single_provider_factor: 0.8   # Prior
  ais_gap:                  # task 010; every value below is a prior, not backtested
    h3_res: 4
    window_h: 24
    step_min: 5
    gap_min_h: 2            # Prior, not backtested
    gap_min_neighbors: 3    # other MMSIs heard near the last fix per hourly bin. Prior, not backtested
    gap_neighbor_km: 20     # Prior, not backtested
    gap_covered_frac: 0.5   # gap needs reception evidence in >= half of its hourly bins. Prior
    closed_report_h: 6      # a closed gap is reported for 6 h after it ended. Prior, not backtested
  warning_area:             # task 010; ADR-005; every value below is a prior, not backtested
    categories: [military_exercise, live_firing, missile_rocket, gnss_interference]
    aoi_margin_km: 25       # one r4 cell radius. Prior
    notice_lookback_days: 30   # events pulled for notices; filtered to active at evaluation time. Prior
  fusion:
    persistence_windows: {gnss_jamming: 2, gnss_spoofing: 2, mil_orbit: 2, ais_spoofing: 2, ais_gap: 2}  # CLAUDE.md: >= 2 windows; ais_* prior, not backtested
    severity: {high: 0.6, medium: 0.35, low: 0.15}  # on score x coverage confidence. Prior
    strong_score: 0.6         # Admiralty credibility 3 (single family strong & persistent) vs 4
    expire_after_min: 60      # open alerts with no fresh evidence for 60 min expire
    dismiss_max_episode_h: 12 # a dismissal owns its episode for <= 12 h after first_seen, then a same-severity campaign re-alerts. Prior (review 003)
    # ADR-005 section C: independent source families (credibility counts families, not domains). Prior, not backtested
    source_family:
      adsb_lol: adsb
      adsb_fi: adsb
      airplanes_live: adsb
      adsb_lol_history: adsb
      opensky: adsb
      gpsjam: adsb          # derived from ADS-B NIC, not independent of it
      aisstream: ais
      gfw: gfw
      gfw_sar: sar
      nga_msi: notice
      china_msa: notice
      faa_nms_notam: notice
    # ADR-005 section D cross-source rules. Prior, not backtested
    corroboration: {proximity_km: 50, jam_ais_km: 100, jam_orbit_km: 100, sar_km: 10, time_slack_h: 2}
