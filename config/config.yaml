# Heimdall runtime configuration. Thresholds cite provenance; calibrate via backtest before changing.

storage:
  duckdb_path: data/heimdall.duckdb
  lake_dir: data/lake
  global_retention_days: 7   # 024g: lake/global/* + is_global store rows; AOI data is kept
  hot_retention_h: 6         # 026a: aircraft/vessels kept in DuckDB this long (lake keeps all)
  hot_retention_events_h: 720  # 026a: events (notices 30 d, thermal/night-lights days); deviates from 6 h in spec
  hot_retention_global_h: 1  # worldwide display rows in DuckDB (OpenSky ~11k/90 s = 2.6 M rows per 6 h, 2026-10-01 crash)
  duckdb_memory_limit: 1GB   # DuckDB default is 80 % of RAM
  duckdb_threads: 4
  bus: memory          # memory | redis (scale-out)
  store: duckdb        # duckdb | clickhouse (scale-out)

privacy:
  # Nothing leaves this machine except GET requests to allow-listed data sources.
  allow_llm_egress: false          # P5: the user must set true before any Evidence is sent to the Claude API
  allow_outbound_sharing: false    # exports/briefs stay local; no upload/share integrations
  redact_entities_in_exports: true

api:
  host: 127.0.0.1      # localhost only until auth is enabled
  port: 8000
  auth: none           # none | oidc (hosted)
  layers: {max_features: 5000, max_hours: 720}   # UI budget, not a threshold

ui:
  # Base map. openfreemap = OpenFreeMap vector tiles (third party sees viewed areas; user-accepted).
  # carto = CARTO vector tiles; none = fully private blank local style (no third-party requests).
  basemap: openfreemap   # openfreemap | carto | none
  overlays: [borders]    # default-on overlays: borders | military | eez | seamarks | graticule

# Live runtime starts with no areas: the analyst draws them (Area of Ops page). The list below is
# kept as presets for the demo, the Hormuz replay, backtests and tests.
use_config_aois: false

aois:
  # role: primary = monitored & alerted; control = calibration/validation only
  - {name: myanmar,        label: "Myanmar", role: primary, lat: 20.5, lon: 96.5,  radius_nm: 250}
  - {name: south_china_sea, label: "South China Sea", role: primary, lat: 12.5, lon: 113.5, radius_nm: 250}
  - {name: taiwan_luzon,   label: "Taiwan / Luzon Strait", role: primary, lat: 22.5, lon: 120.5, radius_nm: 250}
  - {name: malacca_sg,     label: "Malacca / Singapore Strait", role: primary, lat: 3.0,  lon: 100.8, radius_nm: 250}
  - {name: baltic,         label: "Baltic (control)", role: control, lat: 56.0, lon: 20.5,  radius_nm: 250}
  # hormuz: added for the 014d real-data replay (docs/detectors.md, "Hormuz replay"). role primary
  # so replayed alerts are not capped at INFO (control AOIs are); live connectors see it too.
  # Centre = Strait of Hormuz (26.3N 56.3E); 200 NM covers the strait, the Gulf of Oman approaches
  # and the eastern Persian Gulf. Matches the prefilter bbox in scripts/filter_adsblol.py.
  - {name: hormuz,         label: "Strait of Hormuz", role: primary, lat: 26.3, lon: 56.3, radius_nm: 200}

detectors:
  jamming:
    h3_res: 4                 # ~1,770 km^2; r6 too sparse for SE Asia traffic
    window_min: 30
    step_min: 5
    nic_bad_below: 7          # GPSJam convention (NIC < 7 = degraded)
    nacp_bad_below: 8
    bad_dwell_frac: 0.5       # aircraft counts bad if >=50% of its in-cell reports are degraded
    min_aircraft: 5
    ratio_alert: 0.10         # GPSJam 'red' (>10%); de-noised (bad-1)/total
    ratio_clear: 0.06         # hysteresis
    baseline_days: 14
    robust_z: 3.0             # vs median/MAD baseline — alert only on change
    persistence_windows: 2
    mad_floor: 0.02           # eps in z denominator; quiet cell (MAD=0) needs R' >= 0.06 for z>=3. Prior, not yet backtested
    baseline_min_samples: 288 # 1 day of 5-min ticks before z is enforced; until then "no baseline" gap. Prior
    full_coverage_aircraft: 15  # coverage confidence saturates at 15 quality aircraft (docs/detectors.md)
    single_provider_factor: 0.8 # confidence penalty when only one aggregator sees the cell. Prior
    # Emitter localisation, radio-horizon fit d = 4.12 (sqrt(h)+sqrt(h_j)) km (task 029a). All priors, not backtested
    loc_enabled: true
    loc_min_degraded: 3       # bad aircraft with altitude; fewer -> centroid fallback. Prior, not backtested
    loc_min_healthy: 2        # healthy aircraft at similar altitude for the outside test. Prior, not backtested
    loc_degraded_radius_km: 200 # degraded fixes used: within this of the cell's source centroid, any cell. Prior, not backtested
    loc_radius_km: 400        # candidate r6 cells within this of the degraded-fix centroid (task spec)
    loc_max_candidates: 16000 # cap on the grid (radius shrinks to fit); keeps the 5-min tick fast
    loc_jammer_height_m: 10   # assumed ground emitter height. Prior, not backtested
    loc_horizon_km: 4.12      # standard 4/3-earth radio-horizon constant, km per sqrt(m)
    loc_top_k: 25             # minimum top-scoring cells forming the uncertainty ellipse. Prior, not backtested
    loc_agreement_tol: 0.03   # cells within this of the best agreement are the feasible region; point = its centroid. Prior, not backtested
    loc_min_agreement: 0.6    # below this the fit is rejected and the centroid is used. Prior, not backtested
    loc_alt_band_m: 3000      # healthy fixes count only within this altitude of a degraded fix. Prior, not backtested
    loc_max_fixes_per_ac: 6   # per-aircraft thinning (weights keep each aircraft equal). Prior, not backtested
    loc_max_healthy_ac: 100   # nearest healthy aircraft used. Prior, not backtested
    loc_healthy_radius_km: 800 # healthy aircraft considered within this of the centroid. Prior, not backtested
    loc_soft_weight: 0.05     # soft-margin tie-break weight. Prior, not backtested
  spoofing:
    min_dt_s: 5
    teleport_kt: 1323         # Mach 2 @ ISA SL
    speed_diff_kt: 150
    timing_jitter_s: 6        # speed test tolerates this timestamp error: real adsb.fi capture, Malacca 2026-09-30 (5 min, 78 aircraft): 0/4/6 s -> 6/3/0 false evidences
    s5_counts_as_signal: false  # healthy NIC is normal; counts only beside a true teleport or MLAT gap (same capture)
    alt_divergence_ft: 1000   # |alt_geom - alt_baro| beyond regional norm
    mlat_gap_km: 5
    min_signals: 2
    window_min: 30
    step_min: 5
    speed_pair_max_s: 30      # |v_calc-gs| only on pairs <= 30 s (chord error < 10% in a 3 deg/s turn)
    persist_pairs: 2          # S1 must persist >= 2 pairs; single out-and-back fixes are glitches
    s1_span_cap_s: 300        # one jump's anomalous span < 1 step (5 min): a lone jump cannot reach persistence 2
    alt_norm_min_aircraft: 3  # S2 regional norm = median over >= 3 aircraft in the r4 cell
    mlat_max_dt_s: 10
    mlat_min_pairs: 2         # one MLAT outlier is not enough
    cluster_km: 2.0           # S4 (docs/detectors.md)
    cluster_min_aircraft: 3
    cluster_circvar_min: 0.3  # tracks must disagree; formations (same track) excluded
    cluster_min_bins: 2       # S4 in >= 2 one-minute bins
    nic_trusted_min: 7        # S5: GPSJam NIC convention
  orbit:
    window_min: 75
    min_points: 20
    circ_var_min: 0.5
    cum_turn_min_deg: 360
    displacement_max: 0.25
    mil_types: [K35R, KC46, K35E, A332, MRTT, E3TF, E3CF, E737, E7WW, R135, RC35, P8, Q4, GLEX, Y8, Y9, KJ50, KJ2K, H6]
    jam_proximity_km: 100
    critical_min_tankers: 2
    tanker_types: [K35R, K35E, KC46, MRTT, A332, KC10, KC30, Y20U]
    step_min: 5
    resample_s: 30            # thin to >= 30 s so heading noise cannot accumulate into 360 deg
    turn_deadband_deg: 3.0    # ignore sub-3-deg heading jitter in cumulative turn
    novelty_scale_h: 24       # novelty = exp(-prior orbit hours in cell (14 d) / 24 h). Prior
    mlat_factor: 0.8          # confidence penalty for MLAT-majority tracks
  ais_spoofing:             # task 010; every value below is a prior, not backtested
    h3_res: 4
    window_min: 60          # prior, not backtested
    step_min: 5
    teleport_kn: 60         # no merchant ship exceeds ~40 kn; 60 leaves margin. Prior, not backtested
    jump_min_km: 5          # ignore short hops with quantised timestamps. Prior, not backtested
    persist_pairs: 2        # GNSS S1 convention; single out-and-back fixes are glitches. Prior
    span_cap_s: 300         # one jump's anomalous span < 1 step, so a lone jump cannot reach persistence 2. Prior
    collision_km: 50        # two clusters this far apart, alternating = shared MMSI, not spoofing. Prior
    identical_min_vessels: 3   # distinct MMSIs at one position. Prior, not backtested
    identical_decimals: 5      # ~1 m; rafted ships 20 m apart never match. Prior, not backtested
    identical_bin_s: 300
    ring_min_vessels: 5     # Prior, not backtested
    ring_cv_max: 0.1        # radial-distance CV of a spoofed ring. Prior, not backtested
    ring_bearing_circvar_min: 0.7
    ring_radius_km: [0.2, 30]
    ring_poisson_p: 1.0e-3  # chance-alignment guard for RANSAC ring (013a2). Prior, not backtested
    ring_hollow_abs: 1      # interior MMSIs allowed inside 0.8R regardless of density
    ring_hollow_frac: 0.5   # ... or this fraction of the expected interior count
    circle_min_fixes: 20
    circle_rel_rmse_max: 0.05
    circle_min_turn_deg: 720   # >= 2 laps; a purse-seine set is one lap. Prior, not backtested
    circle_max_radius_km: 5
    full_coverage_fixes: 20    # coverage confidence saturates at 20 fixes. Prior
    single_provider_factor: 0.8   # Prior
  ais_gap:                  # task 010; every value below is a prior, not backtested
    h3_res: 4
    window_h: 24
    step_min: 5
    gap_min_h: 2            # Prior, not backtested
    gap_min_neighbors: 3    # other MMSIs heard near the last fix per hourly bin. Prior, not backtested
    gap_neighbor_km: 20     # Prior, not backtested
    gap_covered_frac: 0.5   # gap needs reception evidence in >= half of its hourly bins. Prior
    closed_report_h: 6      # a closed gap is reported for 6 h after it ended. Prior, not backtested
    gap_dr_max_km: 150      # coverage probed along the ship's expected track (ais-gap-1.3.0). Taiwan 2026-09-30: 55 gap alerts, closed ones were 8-16 kn transits out of receiver range. Prior
    valid_mmsi_min: 100000000   # skip 0xx group calls
    valid_mmsi_max: 799999999   # skip 8xx/9xx handhelds, AtoN, SART, fishing-net buoys (900/901/916 seen dark near Taiwan)
  warning_area:             # task 010; ADR-005; every value below is a prior, not backtested
    categories: [military_exercise, live_firing, missile_rocket, gnss_interference]
    aoi_margin_km: 25       # one r4 cell radius. Prior
    notice_lookback_days: 30   # events pulled for notices; filtered to active at evaluation time. Prior
  thermal:                  # task 021a; FIRMS VIIRS fire clusters; ADR-007. Each value: prior, not backtested — calibrate on FIRMS archive, see 016
    window_h: 24            # prior, not backtested — calibrate on FIRMS archive, see 016
    min_confidence: [nominal, high]   # prior, not backtested — calibrate on FIRMS archive, see 016
    min_detections: 3       # per r6 cell. Prior, not backtested — calibrate on FIRMS archive, see 016
    frp_min_mw: 50          # summed FRP per r6 cell. Prior, not backtested — calibrate on FIRMS archive, see 016
    baseline_days: 60       # prior, not backtested — calibrate on FIRMS archive, see 016
    static_days: 10         # r8 cell hot on >= N of baseline_days -> static heat source. Prior, not backtested — calibrate on FIRMS archive, see 016
    ratio_min: 3            # r4 window count / (baseline mean per day + 1). Prior, not backtested — calibrate on FIRMS archive, see 016
    expected_passes: 4      # VIIRS passes per 24 h at SE Asia latitudes (S-NPP, NOAA-20, NOAA-21, x2 day/night). Prior, not backtested — calibrate on FIRMS archive, see 016
  gnss_map:                 # task 031: GPSJam-style daily map (descriptive, never alerts). NIC/NACp thresholds come from detectors.jamming
    dwell_frac: 0.5         # aircraft bad in a cell if >= 50 % of its known reports there are degraded (= jamming.bad_dwell_frac)
    exclude_military: true  # GPSJam FAQ: military trainers block their own antennas in hard manoeuvres
    refresh_min: 15         # rolling last-24 h recompute (~2 s per day of lake data, measured 2026-10-01)
    min_hours_complete: 22  # fewer hourly lake partitions -> day flagged incomplete
    backfill_days: 7
  spectrum_state:           # 033/034: per-AOI band indicators vs own history. Priors, not backtested (ADR-008)
    baseline_days: 14
    min_samples: 288        # 1 day of 5-min ticks before any state but "learning"
    min_samples_hourly: 36  # HF: same-UTC-hour samples (3 days)
    elevated_z: 2.0
    anomalous_z: 3.0
    confidence_cap: 0.6     # experimental single band stays <= medium severity
    explained_factor: 0.5   # confidence x0.5 when space weather could explain it
  fusion:
    persistence_windows: {gnss_jamming: 2, gnss_spoofing: 2, mil_orbit: 2, ais_spoofing: 2, ais_gap: 2, thermal: 2, spectrum_anomaly: 3}  # CLAUDE.md: >= 2 windows; ais_*, thermal prior, not backtested
    severity: {high: 0.6, medium: 0.35, low: 0.15}  # on score x coverage confidence. Prior
    strong_score: 0.6         # Admiralty credibility 3 (single family strong & persistent) vs 4
    expire_after_min: 60      # open alerts with no fresh evidence for 60 min expire
    dismiss_max_episode_h: 12 # a dismissal owns its episode for <= 12 h after first_seen, then a same-severity campaign re-alerts. Prior (review 003)
    # ADR-005 section C: independent source families (credibility counts families, not domains). Prior, not backtested
    source_family:
      adsb_lol: adsb
      adsb_fi: adsb
      adsb_lol_history: adsb
      opensky: adsb
      gpsjam: adsb          # derived from ADS-B NIC, not independent of it
      aisstream: ais
      nga_msi: notice
      faa_nms_notam: notice
      firms: thermal        # ADR-007 s.6. Prior, not backtested
      wspr_live: hf_amateur  # 034: WSPR and PSK Reporter share many amateur stations -> one family
      pskreporter: hf_amateur
      satnogs: satnogs
      sentinel1_rfi: sar
      smap_rfi: radiometer
      open_meteo: context   # context sources never count as families
      swpc: context
      celestrak: context
      stac: context
    # ADR-005 section D cross-source rules. Prior, not backtested
    # task 021c (ADR-007 s.4-5): confounders only lower confidence; each value: prior, not calibrated — review after 022b backtest
    confounders:
      kp_minor: 5           # prior, not calibrated — review after 022b backtest
      kp_minor_factor: 0.8  # prior, not calibrated — review after 022b backtest
      kp_severe: 7          # prior, not calibrated — review after 022b backtest
      kp_severe_factor: 0.5 # prior, not calibrated — review after 022b backtest
      scint_lat_max: 20     # prior, not calibrated — review after 022b backtest
      scint_hours: [19, 2]  # local solar time, wraps midnight. Prior, not calibrated — review after 022b backtest
      scint_factor: 0.85    # prior, not calibrated — review after 022b backtest
      storm_km: 50          # prior, not calibrated — review after 022b backtest
      wind_ms: 20           # prior, not calibrated — review after 022b backtest
      wind_factor: 0.9      # prior, not calibrated — review after 022b backtest
      min_factor: 0.3       # prior, not calibrated — review after 022b backtest
      max_age_h: 6          # forecast-API hourly weather (live, with past_days). Prior, not calibrated — review after 022b backtest
    observability:
      footprint_window_h: 48   # prior, not calibrated — review after 022b backtest
      n_next: 3                # prior, not calibrated — review after 022b backtest
    corroboration: {proximity_km: 50, jam_ais_km: 100, jam_orbit_km: 100, time_slack_h: 2, thermal_jam_km: 50}  # thermal_jam_km: prior, not backtested (task 022b)

schedule: {}                # task 022a: per-source daily run times (UTC); none configured
