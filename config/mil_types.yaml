# Military aircraft type reference (task 047). Static background shown when an aircraft is investigated:
# what the type is built for and roughly what it can do. Figures are rounded public figures (manufacturer /
# Wikipedia, linked per type), not live data and not this airframe's configuration.
# Keys: ICAO type designator. n name · m mission · range_km typical range (ferry if noted) · end_h endurance ·
# crew · aar air-to-air refuelling: gives | receives | both | none · cap capabilities in plain words · w Wikipedia.
# Airliner and business-jet codes (A332, B762, GLF5, ...) cover several military versions; the text says so.
