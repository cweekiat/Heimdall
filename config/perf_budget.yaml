# API latency budgets (task 063/064): p95 in milliseconds, measured over the network by
# scripts/perf_budget.py against the dev VM after each deploy. Basis: docs/reports/2026-09-30-perf.md
# (in-process p95: small bbox < 20 ms, busy sea bbox 78 ms) plus ~150 ms for Cloudflare + tunnel
# round trips from a CI runner. Tighten once dev-VM baselines exist.
p95_ms:
  /api/ready: 300
  /api/alerts?limit=200: 600
  /api/aois/summary: 600
  /api/sources: 400
  /api/traffic/air?bbox=95,0,125,25&fmt=compact: 900
  /api/traffic/sea?bbox=100,0,110,8&fmt=compact: 1200
