# Source registry. `verified` is set by source-scout after a live check (see docs/sources.md).
# reliability = Admiralty A–F. Secrets referenced by env var name only.
sources:
  adsb_lol:        {uses_aois: true, domain: air,    reliability: B, latency_s: 5,     base: "https://api.adsb.lol",             auth: none,            rps: 0.5, phase: 1, verified: true}  # 0.5: 1 rps drew HTTP 429s on 2026-09-30 once empty AOIs stopped idling
  adsb_fi:         {uses_aois: true, domain: air,    reliability: B, latency_s: 5,     base: "https://opendata.adsb.fi/api",     auth: none,            rps: 1,   phase: 1, verified: true}
  adsb_lol_history: {domain: air,    reliability: B, latency_s: 86400, base: "https://github.com/adsblol",       auth: none,                      phase: 1, verified: true}
  opensky:         {domain: air,    reliability: B, latency_s: 10,    base: "https://opensky-network.org/api",  auth: OPENSKY_CLIENT_ID, phase: 1, verified: false}
  # 024g: worldwide display-only aircraft (4 credits/call, 4000/day => >= 86.4 s). Enabled by keys.
  opensky_global:  {domain: air,    reliability: B, latency_s: 90,    base: "https://opensky-network.org/api",  auth: OPENSKY_CLIENT_ID, auth_secret: OPENSKY_CLIENT_SECRET, impl: "heimdall.ingest.opensky:build", poll_s: 90, phase: 3, verified: false}
  gpsjam:          {domain: air,    reliability: B, latency_s: 86400, base: "https://gpsjam.org",               auth: none,                      phase: 1, verified: true}
  faa_nms_notam:   {domain: air,    reliability: A, latency_s: 300,   base: "https://nms.aim.faa.gov",          auth: FAA_NMS_KEY, auth_secret: FAA_NMS_SECRET, impl: "heimdall.ingest.faa_nms:build", poll_s: 300, phase: 2, verified: false}
  aisstream:       {uses_aois: true, domain: sea,    reliability: B, latency_s: 5,     base: "wss://stream.aisstream.io/v0/stream", auth: AISSTREAM_KEY, impl: "heimdall.ingest.ais:build", poll_s: 0, message_types: [PositionReport, StandardClassBPositionReport, ExtendedClassBPositionReport, ShipStaticData, StaticDataReport], min_interval_s: 10, global: true, global_min_interval_s: 60, phase: 2, verified: false}
  nga_msi:         {domain: sea,    reliability: A, latency_s: 3600,  base: "https://msi.nga.mil/api",          auth: none, impl: "heimdall.ingest.nga_msi:build", poll_s: 3600, phase: 2, verified: false}
  firms:           {domain: space,  reliability: A, latency_s: 10800, base: "https://firms.modaps.eosdis.nasa.gov/api", auth: FIRMS_MAP_KEY, impl: "heimdall.ingest.firms:build", poll_s: 900, products: [VIIRS_SNPP_NRT, VIIRS_NOAA20_NRT, VIIRS_NOAA21_NRT], day_range: 1, phase: 3, verified: false}  # prior; rate/latency from 016; MODIS_NRT optional via products
  open_meteo:      {domain: events, reliability: A, latency_s: 3600,  base: "https://api.open-meteo.com/v1",    auth: none, impl: "heimdall.ingest.open_meteo:build", poll_s: 21600, grid_deg: 1.0, rps: 0.1, lookback_days: 7, past_days: 2, phase: 3, verified: false}  # grid 1.0 deg + 0.1 rps (50 pts/req = 300 locations/min): 0.5 deg/0.5 rps hit HTTP 429 on 2026-09-30 (1451 locations/poll vs free 600/min); live forecast API, not archive-api
  swpc:            {domain: space,  reliability: A, latency_s: 3600,  base: "https://services.swpc.noaa.gov",   auth: none, impl: "heimdall.ingest.swpc:build", poll_s: 1800, phase: 3, verified: false}  # prior; rate/latency from 016
  celestrak:       {uses_aois: true, domain: space,  reliability: A, latency_s: 86400, base: "https://celestrak.org", auth: none, impl: "heimdall.ingest.celestrak:build", poll_s: 86400, pass_horizon_h: 48, min_elev_deg: 20, satellites: {39634: {name: SENTINEL-1A, sensor: C-SAR}, 62261: {name: SENTINEL-1C, sensor: C-SAR}, 37849: {name: SUOMI NPP, sensor: VIIRS}, 43013: {name: NOAA 20, sensor: VIIRS}, 54234: {name: NOAA 21, sensor: VIIRS}}, phase: 3, verified: false}
  stac:            {uses_aois: true, domain: space,  reliability: A, latency_s: 86400, base: "https://earth-search.aws.element84.com/v1", auth: none, impl: "heimdall.ingest.stac:build", poll_s: 21600, collections: [sentinel-1-grd], lookback_days: 10, max_items: 500, phase: 3, verified: false}
  gdelt:           {domain: events, reliability: C, latency_s: 900,   base: "https://api.gdeltproject.org/api/v2", auth: none,                 phase: 4, verified: false}
