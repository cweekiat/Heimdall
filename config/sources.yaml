# Source registry. `verified` is set by source-scout after a live check (see docs/sources.md).
# reliability = Admiralty A–F. Secrets referenced by env var name only.
# Data Sources page lists only runnable sources (an `impl` or an ADS-B provider) that are not `retired`.
# Entries without an impl stay for Admiralty grading/backtests. 036: stac retired (Sentinel-1 footprints
# duplicate sentinel1_rfi for the RF mission); smos (blocked) and gdelt (planned) removed.
sources:
  adsb_lol:        {label: "Aircraft (ADS-B) · adsb.lol", about: "Live aircraft positions and GPS accuracy in your areas", uses_aois: true, domain: air,    reliability: B, latency_s: 5,     base: "https://api.adsb.lol",             auth: none,            rps: 0.5, phase: 1, verified: true}  # 0.5: 1 rps drew HTTP 429s on 2026-09-30 once empty AOIs stopped idling
  adsb_fi:         {label: "Aircraft (ADS-B) · adsb.fi", about: "Live aircraft in your areas plus the worldwide GPS-interference sweep", uses_aois: true, domain: air,    reliability: B, latency_s: 5,     base: "https://opendata.adsb.fi/api",     auth: none,            rps: 1,   phase: 1, verified: true, gnss_sweep: {enabled: true, every: 2, spacing_km: 700, lat: [-50, 70], backoff: 12}}  # 031 global GNSS map: 1 world-sweep point per 2 AOI polls (stays within 1 rps); empty points skipped 12 passes
  adsb_mil:        {label: "Military aircraft worldwide · adsb.lol / adsb.fi", about: "Every aircraft flagged military by the ADS-B networks, worldwide, each minute", domain: air, reliability: B, latency_s: 60, impl: "heimdall.ingest.adsb_mil:build", poll_s: 60, rps: 0.2, providers: [{name: adsb.lol, url: "https://api.adsb.lol/v2/mil"}, {name: adsb.fi, url: "https://opendata.adsb.fi/api/v2/mil"}], phase: 7, verified: true}  # task 039: ~260 aircraft, 110 KB per call (2026-10-01)
  plane_alert_db:  {label: "Aircraft of interest list · plane-alert-db", about: "Community list of ~17,000 military, government and special aircraft (ODbL), refreshed daily", domain: air, reliability: C, latency_s: 86400, base: "https://raw.githubusercontent.com/sdr-enthusiasts/plane-alert-db/main/plane-alert-db.csv", impl: "heimdall.ingest.plane_alert:build", poll_s: 86400, rps: 0.1, path: data/ref/plane-alert-db.csv, phase: 7, verified: true}  # task 039: 2.4 MB, 17,259 rows (2026-10-01); identifies ~53 % of /v2/mil aircraft
  ourairports:     {label: "Airfields · OurAirports", about: "Public-domain list of ~70,000 airports, air bases and heliports: where an aircraft took off", domain: air, reliability: B, latency_s: 604800, base: "https://davidmegginson.github.io/ourairports-data/airports.csv", impl: "heimdall.ingest.ourairports:build", poll_s: 604800, rps: 0.1, path: data/ref/airports.csv, phase: 7, verified: true}  # task 047: 12.7 MB, 86,158 rows, 1,813 named military fields (2026-10-03); host approved by the user
  osm_bases:       {label: "Military bases · OpenStreetMap", about: "Named air, naval and military bases worldwide (OpenStreetMap, ODbL), refreshed weekly", domain: air, reliability: C, latency_s: 604800, base: "https://overpass-api.de/api/interpreter", impl: "heimdall.ingest.osm_bases:build", poll_s: 604800, rps: 0.05, path: data/ref/military_bases.json, phase: 7, verified: true}  # task 049: 5,684 named bases, ~50 s server time (2026-10-03); host approved by the user
  gdelt:           {label: "Conflict events · GDELT", about: "Assaults, fighting and shows of force coded from world news every 15 min (noisy: context only)", domain: events, reliability: D, latency_s: 1800, base: "https://data.gdeltproject.org", impl: "heimdall.ingest.gdelt:build", poll_s: 900, rps: 0.2, phase: 7, verified: true}  # task 049: ~600 events / 15 min, ~45 conflict events kept (2026-10-03); host approved by the user
  news_rss:        {label: "World news · BBC, Al Jazeera", about: "Headlines for context only: shown in a ticker, never turned into alerts or AI input", domain: events, reliability: C, latency_s: 3600, base: "https://feeds.bbci.co.uk", impl: "heimdall.ingest.news_rss:build", poll_s: 900, rps: 0.2, feeds: {"BBC World": "https://feeds.bbci.co.uk/news/world/rss.xml", "Al Jazeera": "https://www.aljazeera.com/xml/rss/all.xml"}, allowed_hosts: [www.aljazeera.com], phase: 7, verified: true}  # task 049: ~30 + ~25 items per feed (2026-10-03); AP blocked by a bot challenge (not used); hosts approved by the user
  adsb_lol_history: {domain: air,    reliability: B, latency_s: 86400, base: "https://github.com/adsblol",       auth: none,                      phase: 1, verified: true}
  opensky:         {domain: air,    reliability: B, latency_s: 10,    base: "https://opensky-network.org/api",  auth: OPENSKY_CLIENT_ID, phase: 1, verified: false}
  # 024g: worldwide display-only aircraft (4 credits/call, 4000/day => >= 86.4 s). Enabled by keys.
  opensky_global:  {label: "Aircraft worldwide · OpenSky", about: "Every aircraft on Earth every 90 s, for the map only (needs a free OpenSky API client)", domain: air,    reliability: B, latency_s: 90,    base: "https://opensky-network.org/api",  auth: OPENSKY_CLIENT_ID, auth_secret: OPENSKY_CLIENT_SECRET, impl: "heimdall.ingest.opensky:build", poll_s: 90, phase: 3, verified: false}
  gpsjam:          {domain: air,    reliability: B, latency_s: 86400, base: "https://gpsjam.org",               auth: none,                      phase: 1, verified: true}
  faa_nms_notam:   {label: "NOTAMs · FAA", about: "Official notices to airmen, including GPS-interference notices (needs FAA NMS access)", domain: air,    reliability: A, latency_s: 300,   base: "https://nms.aim.faa.gov",          auth: FAA_NMS_KEY, auth_secret: FAA_NMS_SECRET, impl: "heimdall.ingest.faa_nms:build", poll_s: 300, phase: 2, verified: false}
  aisstream:       {label: "Ships (AIS) · AISStream", about: "Live ship positions; feeds ship-gone-dark and AIS spoofing detection (needs a free key)", uses_aois: true, domain: sea,    reliability: B, latency_s: 5,     base: "wss://stream.aisstream.io/v0/stream", auth: AISSTREAM_KEY, impl: "heimdall.ingest.ais:build", poll_s: 0, message_types: [PositionReport, StandardClassBPositionReport, ExtendedClassBPositionReport, ShipStaticData, StaticDataReport], min_interval_s: 10, global: true, global_min_interval_s: 60, phase: 2, verified: false}
  nga_msi:         {label: "Navigation warnings · NGA", about: "Official maritime warnings (live firing, GPS interference, exercises)", domain: sea,    reliability: A, latency_s: 3600,  base: "https://msi.nga.mil/api",          auth: none, impl: "heimdall.ingest.nga_msi:build", poll_s: 3600, phase: 2, verified: false}
  firms:           {label: "Heat spots · NASA FIRMS", about: "Satellite fire and heat detections (needs a free map key)", domain: space,  reliability: A, latency_s: 10800, base: "https://firms.modaps.eosdis.nasa.gov/api", auth: FIRMS_MAP_KEY, impl: "heimdall.ingest.firms:build", poll_s: 900, products: [VIIRS_SNPP_NRT, VIIRS_NOAA20_NRT, VIIRS_NOAA21_NRT], day_range: 1, phase: 3, verified: false}  # prior; rate/latency from 016; MODIS_NRT optional via products
  open_meteo:      {label: "Weather · Open-Meteo", about: "Cloud, rain and wind, used to rule out weather as a cause", domain: events, reliability: A, latency_s: 3600,  base: "https://api.open-meteo.com/v1",    auth: none, impl: "heimdall.ingest.open_meteo:build", poll_s: 21600, grid_deg: 1.0, rps: 0.1, lookback_days: 7, past_days: 2, phase: 3, verified: false}  # grid 1.0 deg + 0.1 rps (50 pts/req = 300 locations/min): 0.5 deg/0.5 rps hit HTTP 429 on 2026-09-30 (1451 locations/poll vs free 600/min); live forecast API, not archive-api
  swpc:            {label: "Space weather · NOAA", about: "Solar storms and flares that disturb HF radio and GPS on their own", domain: space,  reliability: A, latency_s: 3600,  base: "https://services.swpc.noaa.gov",   auth: none, impl: "heimdall.ingest.swpc:build", poll_s: 1800, phase: 3, verified: false}  # prior; rate/latency from 016
  celestrak:       {label: "Satellite orbits · CelesTrak", about: "Orbits for the satellites on the globe and their next passes", uses_aois: true, domain: space,  reliability: A, latency_s: 86400, base: "https://celestrak.org", auth: none, impl: "heimdall.ingest.celestrak:build", poll_s: 86400, pass_horizon_h: 48, min_elev_deg: 20, satellites: {39634: {name: SENTINEL-1A, sensor: C-SAR}, 62261: {name: SENTINEL-1C, sensor: C-SAR}, 37849: {name: SUOMI NPP, sensor: VIIRS}, 43013: {name: NOAA 20, sensor: VIIRS}, 54234: {name: NOAA 21, sensor: VIIRS}}, groups: {gnss: "GNSS", stations: "Space station"}, phase: 3, verified: false}
  stac:            {retired: true, uses_aois: true, domain: space,  reliability: A, latency_s: 86400, base: "https://earth-search.aws.element84.com/v1", auth: none, impl: "heimdall.ingest.stac:build", poll_s: 21600, collections: [sentinel-1-grd], lookback_days: 10, max_items: 500, phase: 3, verified: false}
  # ADR-008 spectrum sources; endpoints checked live 2026-10-01 (docs/sources.md)
  wspr_live:       {label: "HF propagation · WSPR", about: "Amateur radio beacon reports showing how HF signals travel", domain: spectrum, reliability: B, latency_s: 900,   base: "https://db1.wspr.live", auth: none, impl: "heimdall.ingest.wspr:build", poll_s: 600, rps: 0.2, bbox: [20, -45, 180, 72], grid_deg: 4.0, rx_grid_deg: 2.0, bin_min: 10, lookback_min: 60, settle_min: 5, min_km: 500, max_km: 12000, phase: 6, verified: true}  # task 050: box widened to Eurasia east of 20°E + Australia at 4° (detector cells), ~3k rows/h WSPR vs 0.76k (2026-10-02 12 UTC); ~333k spots/h global, aggregated server-side (~1.9k rows/h in bbox, 0.09 s query)
  pskreporter:     {label: "HF propagation · PSK Reporter", about: "Amateur radio reception reports (second HF network)", domain: spectrum, reliability: C, latency_s: 900,   base: "https://retrieve.pskreporter.info", auth: none, impl: "heimdall.ingest.pskreporter:build", poll_s: 300, rps: 0.1, window_s: 900, bbox: [20, -45, 180, 72], grid_deg: 4.0, rx_grid_deg: 2.0, bin_min: 10, min_km: 500, max_km: 12000, phase: 6, verified: true}  # task 050: box widened to Eurasia east of 20°E + Australia at 4° (detector cells), ~3k rows/h WSPR vs 0.76k (2026-10-02 12 UTC); provider limit: <= 1 query / 5 min; MQTT ports unreachable via egress proxy (2026-10-01)
  satnogs:         {label: "Satellite downlinks · SatNOGS", about: "Volunteer ground stations listening to satellites", domain: spectrum, reliability: C, latency_s: 3600,  base: "https://network.satnogs.org", auth: none, impl: "heimdall.ingest.satnogs:build", poll_s: 1800, rps: 0.3, lookback_h: 3, max_pages: 40, bbox: [60, -20, 160, 50], phase: 5, verified: true}  # ~240 obs/h global (10 pages/h); 50 active stations in bbox (2026-10-01)
  sentinel1_rfi:   {label: "C-band interference · Sentinel-1", about: "Radar-satellite reports of radio interference near 5.4 GHz", uses_aois: true, domain: spectrum, reliability: A, latency_s: 86400, base: "https://planetarycomputer.microsoft.com/api/stac/v1", sas_url: "https://planetarycomputer.microsoft.com/api/sas/v1/token/sentinel-1-grd", auth: none, impl: "heimdall.ingest.sentinel1_rfi:build", poll_s: 21600, rps: 0.5, lookback_days: 3, max_items: 200, allowed_hosts: [".blob.core.windows.net"], phase: 5, verified: true}  # RFI annotation XML only (~12 KB/pol), no imagery
  smap_rfi:        {label: "L-band interference · NASA SMAP", about: "Radiometer reports of interference near 1.4 GHz (needs an Earthdata token)", domain: spectrum, reliability: A, latency_s: 10800, base: "https://cmr.earthdata.nasa.gov", auth: EARTHDATA_TOKEN, impl: "heimdall.ingest.smap:build", short_name: SPL1BTB_NRT, poll_s: 3600, rps: 0.2, lookback_h: 12, max_granules: 6, h3_res: 4, rfi_bit: 2, bbox: [60, -20, 160, 50], allowed_hosts: [data.nsidc.earthdatacloud.nasa.gov], phase: 5, verified: false}  # CMR search verified (NRT ~3 h, ~40 MB/granule); download needs EARTHDATA_TOKEN (not set 2026-10-01)
  cygnss:          {label: "GNSS interference from orbit · NASA CYGNSS", about: "Satellites hearing GPS L1 noise over sea and land, ±38° latitude, 2–3 days late (needs an Earthdata token)", domain: spectrum, reliability: A, latency_s: 259200, base: "https://cmr.earthdata.nasa.gov", auth: EARTHDATA_TOKEN, impl: "heimdall.ingest.cygnss:build", short_name: CYGNSS_L1_V3.2, poll_s: 10800, rps: 0.2, lookback_days: 4, baseline_days: 14, max_granules: 8, h3_res: 3, min_samples: 20, bbox: [25, -40, 160, 40], allowed_hosts: [opendap.earthdata.nasa.gov], phase: 5, verified: true}  # task 038: OPeNDAP 5-variable subset ~8 MB per satellite-day (vs 1.15 GB file), 7 satellites, checked live 2026-10-01
