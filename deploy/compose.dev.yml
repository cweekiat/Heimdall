# Development build (dev deps, tests, UI source maps):
#   docker compose -f deploy/compose.yml -f deploy/compose.dev.yml up --build
#   docker compose -f deploy/compose.yml -f deploy/compose.dev.yml run --rm heimdall pytest -q
# For hot reload of the UI use `cd web && npm run dev` instead.
services:
  heimdall:
    image: heimdall-dev:local
    build: {target: dev}
