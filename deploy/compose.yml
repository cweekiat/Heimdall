# Run Heimdall in Docker on your own machine (tasks 063, 067). Bound to 127.0.0.1 only.
#   docker compose -f deploy/compose.yml up --build            # production build
#   docker compose -f deploy/compose.yml -f deploy/compose.dev.yml up --build   # development build
# Open http://127.0.0.1:8000. Data (lake, DuckDB, basemap, secrets) lives in HEIMDALL_DATA (default
# ../data). API keys: the Keys page needs a loopback client, so in Docker set them as environment
# variables (e.g. FIRMS_MAP_KEY) in a local env file, or run natively with `uv run python -m heimdall.run`.
name: heimdall

services:
  heimdall:
    image: heimdall:local
    build: {context: .., dockerfile: deploy/Dockerfile, target: prod}
    user: "10001:10001"
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ${HEIMDALL_DATA:-../data}:/app/data
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/api/ready', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3
