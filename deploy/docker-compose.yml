# ADR-002: one process hosts ingest + detection + API (DuckDB is single-writer).
# Containers bind 0.0.0.0 internally; ports are published on the host loopback only.
services:
  worker:
    build: {context: .., dockerfile: deploy/Dockerfile.worker}
    environment:
      HEIMDALL_API_HOST: 0.0.0.0
      HEIMDALL_METRICS_HOST: 0.0.0.0
    volumes: ["../data:/app/data"]
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9108:9108"
    restart: unless-stopped
  demo:
    # optional: standalone demo API on in-memory data (no DB, no lock). `--profile demo`
    profiles: [demo]
    build: {context: .., dockerfile: deploy/Dockerfile.api}
    ports: ["127.0.0.1:8001:8000"]
  web:
    # placeholder until the frontend task lands
    image: busybox:stable
    command: ["sh", "-c", "echo web placeholder; sleep infinity"]
