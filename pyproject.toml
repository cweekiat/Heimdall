[project]
name = "heimdall"
version = "0.0.1"
description = "Multi-domain OSINT EW & activity monitor (GNSS jamming/spoofing, military loitering)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "websockets>=13",
  "duckdb>=1.1",
  "pyarrow>=17",
  "polars>=1.8",
  "numpy>=2.0",
  "h3>=4.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "structlog>=24.4",
  "prometheus-client>=0.21",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "types-pyyaml", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heimdall"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
