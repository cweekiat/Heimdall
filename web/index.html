<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heimdall</title>
  </head>
  <body>
    <main id="mapwrap" aria-label="Operational map">
      <div id="map" data-tour="map"></div>
      <div id="maptype" aria-label="Map type"></div>
      <div id="legend" data-tour="legend"></div>
      <div id="mapctl" aria-label="Map controls"></div>
      <div id="readout" aria-live="off"></div>
    </main>
    <header id="statusbar" aria-label="Top bar">
      <div class="tb-left">
        <strong class="brand" id="brand">HEIMDALL</strong>
        <span id="clock" aria-label="Time (display zone, set in Settings)" title="Time zone: Settings"></span>
        <span id="live" class="live-dot" role="status" aria-label="Offline"></span>
        <span id="sb-fresh" aria-label="Data source health"></span>
        <span id="sb-tools"></span>
      </div>
      <div id="search" class="tb-center" role="search"></div>
      <div class="tb-right">
        <span id="sb-counts" aria-label="Open alerts by priority"></span>
        <span id="sb-actions" data-tour="topbar"></span>
      </div>
    </header>
    <nav id="toolbar" data-tour="toolbar" aria-label="Pages"></nav>
    <div id="toast" hidden role="alert"></div>
    <div id="hidden-hosts" hidden>
      <div id="board" aria-label="Areas"></div>
      <div id="queue"></div>
      <div id="inspector" aria-label="Alert details"></div>
      <div id="timeline" aria-label="Timeline"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
